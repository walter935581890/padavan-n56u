name: walter-padavan

on:
  workflow_dispatch:
    inputs:
      target1:
        type: choice
        description: '要编译的型号（取自 trunk/configs/templates）'
        options:
        - '360P2'
        - '5K-W20'
        - 'A3004NS'
        - 'B70'
        - 'CR660x'
        - 'DIR-878'
        - 'DIR-882'
        - 'E8820V2'
        - 'HC5661'
        - 'HC5661A'
        - 'HC5761A'
        - 'HC5861B'
        - 'JCG-836PRO'
        - 'JCG-AC860M'
        - 'JCG-Q20'
        - 'JCG-Y2'
        - 'K2P'
        - 'K2P-USB'
        - 'K2P_nano'
        - 'MI-3'
        - 'MI-3C'
        - 'MI-4'
        - 'MI-MINI'
        - 'MI-NANO'
        - 'MI-R3G'
        - 'MI-R3P'
        - 'MI-R3P-breed'
        - 'MI-R4A'
        - 'MR2600'
        - 'MSG1500'
        - 'MZ-R13'
        - 'MZ-R13P'
        - 'NETGEAR-BZV'
        - 'NETGEAR-CHJ'
        - 'NEWIFI-MINI'
        - 'NEWIFI3'
        - 'OYE-001'
        - 'PSG1208'
        - 'PSG1218'
        - 'PSG1218_nano'
        - 'R2100'
        - 'R6220'
        - 'RM2100'
        - 'RT-AC1200GU'
        - 'WDR7300'
        - 'WR1200JS'
        - 'XY-C1'
        - 'ZTE_E8820S'
        default: 'HC5661'
      plugins:
        type: string
        description: '要集成的插件，逗号分隔，留空=一个都不带，all=全开。可选：adbyby aliddns pgyvpn ttyd zerotier'
        default: ''
      debug_enabled:
        description: '开 tmate 调试'
        required: false
        default: 'no'
  push:
    branches: [ master ]

# 本仓库现在只有这 5 个插件：
#   adbyby    广告过滤（/etc_ro 规则包 + /usr/bin/adbyby.sh）  开关 CONFIG_FIRMWARE_INCLUDE_ADBYBY
#   aliddns   阿里云 DDNS（/usr/bin/aliddns.sh + /etc_ro/ddns_script.sh） 开关 CONFIG_FIRMWARE_INCLUDE_ALIDDNS
#   pgyvpn    蒲公英异地组网（/usr/bin/pgyvpn.sh，来自 pgyvpn-ci.tar.gz） 开关 CONFIG_FIRMWARE_INCLUDE_PGYVPN
#   ttyd      网页终端（源码树自带） 开关 CONFIG_FIRMWARE_INCLUDE_TTYD
#   zerotier  ZeroTier 组网（预编译二进制 + /usr/bin/zerotier.sh） 开关 CONFIG_FIRMWARE_INCLUDE_ZEROTIER

jobs:
  build:
    name: build
    runs-on: ubuntu-22.04
    env:
      TNAME: ${{ github.event.inputs.target1 || 'HC5661' }}
      PLUGINS: ${{ github.event.inputs.plugins || '' }}
      images_dir: /opt/images
    steps:
      - uses: actions/checkout@v4

      - name: Show what will be built
        run: |
          echo "型号: $TNAME"
          echo "插件: ${PLUGINS:-（无）}"

      - name: Prepare environment
        run: |
          sudo apt-get update -o Acquire::Retries=3 || true
          sudo apt-get -y install libtool-bin gperf python3-docutils autopoint gettext \
            p7zip-full cpio fakeroot unzip xxd flex bison kmod libncurses5-dev shellcheck \
            || echo "::warning::apt 安装不完整，继续"

