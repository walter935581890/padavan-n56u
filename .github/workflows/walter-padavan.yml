name: walter-padavan

on:
  workflow_dispatch:
    inputs:
      target1:
        type: choice
        description: '要编译的型号（取自 trunk/configs/templates）'
        options:
        - '360P2'
        - '5K-W20'
        - 'A3004NS'
        - 'B70'
        - 'CR660x'
        - 'DIR-878'
        - 'DIR-882'
        - 'E8820V2'
        - 'HC5661'
        - 'HC5661A'
        - 'HC5761A'
        - 'HC5861B'
        - 'JCG-836PRO'
        - 'JCG-AC860M'
        - 'JCG-Q20'
        - 'JCG-Y2'
        - 'K2P'
        - 'K2P-USB'
        - 'K2P_nano'
        - 'MI-3'
        - 'MI-3C'
        - 'MI-4'
        - 'MI-MINI'
        - 'MI-NANO'
        - 'MI-R3G'
        - 'MI-R3P'
        - 'MI-R3P-breed'
        - 'MI-R4A'
        - 'MR2600'
        - 'MSG1500'
        - 'MZ-R13'
        - 'MZ-R13P'
        - 'NETGEAR-BZV'
        - 'NETGEAR-CHJ'
        - 'NEWIFI-MINI'
        - 'NEWIFI3'
        - 'OYE-001'
        - 'PSG1208'
        - 'PSG1218'
        - 'PSG1218_nano'
        - 'R2100'
        - 'R6220'
        - 'RM2100'
        - 'RT-AC1200GU'
        - 'WDR7300'
        - 'WR1200JS'
        - 'XY-C1'
        - 'ZTE_E8820S'
        default: 'HC5661'
      plugins:
        type: string
        description: '可选插件，逗号分隔：adbyby pgyvpn zerotier（ttyd 固定集成，不用填）。留空=只带 ttyd，all=三个全要'
        default: ''
      debug_enabled:
        description: '开 tmate 调试'
        required: false
        default: 'no'
  push:
    branches: [ master ]

# 可选插件 3 个（下拉里只出现这些）：
#   adbyby    广告过滤（/etc_ro 规则包 + /usr/bin/adbyby.sh）  开关 CONFIG_FIRMWARE_INCLUDE_ADBYBY
#   pgyvpn    蒲公英异地组网（/usr/bin/pgyvpn.sh，来自 pgyvpn-ci.tar.gz） 开关 CONFIG_FIRMWARE_INCLUDE_PGYVPN
#   zerotier  ZeroTier 组网（预编译二进制 + /usr/bin/zerotier.sh） 开关 CONFIG_FIRMWARE_INCLUDE_ZEROTIER
#
# 固定集成（不在选择里，但每版固件一定有）：
#   ttyd      网页终端（源码树自带） 开关 CONFIG_FIRMWARE_INCLUDE_TTYD=y

jobs:
  build:
    name: build
    runs-on: ubuntu-22.04
    env:
      TNAME: ${{ github.event.inputs.target1 || 'HC5661' }}
      PLUGINS: ${{ github.event.inputs.plugins || '' }}
      images_dir: /opt/images
    steps:
      - uses: actions/checkout@v4

      - name: Show what will be built
        run: |
          echo "型号: $TNAME"
          echo "插件: ${PLUGINS:-（无）}"

      - name: Prepare environment
        run: |
          sudo apt-get update -o Acquire::Retries=3 || true
          sudo apt-get -y install libtool-bin gperf python3-docutils autopoint gettext \
            p7zip-full cpio fakeroot unzip xxd flex bison kmod libncurses5-dev shellcheck \
            || echo "::warning::apt 安装不完整，继续"

      - name: Verify HC5661 board support
        if: ${{ env.TNAME == 'HC5661' }}
        run: |
          cd trunk
          for f in configs/boards/HC5661/board.h configs/boards/HC5661/board.mk \
                   configs/boards/HC5661/kernel-3.4.x.config configs/templates/HC5661.config ; do
            [ -f "$f" ] || { echo "::error::仓库里缺少 $f"; exit 1; }
          done

          grep -q 'BOARD_NUM_ETH_EPHY.*5' configs/boards/HC5661/board.h \
            || { echo "::error::board.h 里 BOARD_NUM_ETH_EPHY 不是 5（1 WAN + 4 LAN）"; exit 1; }
          grep -q '^CONFIG_RAETH_ESW_PORT_WAN=0' configs/boards/HC5661/kernel-3.4.x.config \
            || { echo "::error::内核里 WAN 不是 P0"; exit 1; }
          grep -q '^CONFIG_RAETH_ESW_PORT_LAN1=1' configs/boards/HC5661/kernel-3.4.x.config \
            || { echo "::error::内核里 LAN1 不是 P1"; exit 1; }
          if grep -q '^CONFIG_MT76X2_AP=y' configs/boards/HC5661/kernel-3.4.x.config \
             || grep -q '^CONFIG_RT_FIRST_IF_RANGE_5GHZ=y' configs/boards/HC5661/kernel-3.4.x.config ; then
            echo "::error::内核里 5G 没关掉（MT76X2_AP 或 RANGE_5GHZ 被打开）"; exit 1
          fi
          grep -q 'CONFIG_FIRMWARE_PRODUCT_ID="HC5661"' configs/templates/HC5661.config \
            || { echo "::error::模板里 PRODUCT_ID 不是 HC5661"; exit 1; }
          if grep -q 'WIFI5_DRIVER' configs/templates/HC5661.config ; then
            echo "::error::模板里还有 5G 驱动"; exit 1
          fi

          echo "==== HC5661 板级参数 ===="
          grep -E 'BOARD_PID|BOARD_DESC|BOARD_NUM_ETH_EPHY|BOARD_HAS_5G_11AC|BOARD_GPIO_LED_(POWER|WAN)' configs/boards/HC5661/board.h
          grep -E 'BOARD_HC5661|BOARD_NUM_USB_PORTS' configs/boards/HC5661/board.mk
          grep -E '^CONFIG_RALINK_MT7620=|^CONFIG_MT7620_ASIC=|^CONFIG_RT2880_DRAM_128M=|^CONFIG_RAETH_ESW_PORT_(WAN|LAN1|LAN2|LAN3|LAN4)=' \
            configs/boards/HC5661/kernel-3.4.x.config
          echo '板级检查通过：EPHY=5 / WAN=P0 / LAN1-4=P1-P4 / 无 5G / 无 USB'

          # 内核配置预演：CI 没有终端，silentoldconfig 一旦要交互就直接失败
          K=linux-3.4.x
          cp -rfL proprietary/rt_wifi/rtsoc/2.7.X.X/rt2860v2 \
                  proprietary/rt_wifi/rtsoc/2.7.X.X/rt2860v2_ap \
                  "$K/drivers/net/wireless/ralink/" 2>/dev/null || true
          cp -f configs/boards/HC5661/kernel-3.4.x.config "$K/.config"
          sed -i 's/^# CONFIG_RT_FIRST_IF_RT2860 is not set/CONFIG_RT_FIRST_IF_RT2860=y/; s/^CONFIG_RT_FIRST_IF_MT7620=y/# CONFIG_RT_FIRST_IF_MT7620 is not set/' "$K/.config"
          if ! ( cd "$K" && timeout 90 env ARCH=mips make silentoldconfig </dev/null >/tmp/kconf.log 2>&1 ) ; then
            echo "::error::内核配置和源码 Kconfig 对不上，构建时会卡在 silentoldconfig 交互提示"
            tail -25 /tmp/kconf.log
            exit 1
          fi
          echo '内核配置预演通过：silentoldconfig 无交互'

      - name: Unpack uploaded plugins and add build hooks
        run: |
          pick() {
            for p in "./$1" "trunk/user/$1" ; do
              if [ -f "$p" ] ; then echo "$p" ; return 0 ; fi
            done
            return 1
          }
          hook() {
            if grep -q "$1" trunk/user/Makefile ; then return 0 ; fi
            awk -v sym="$1" -v d="$2" 'BEGIN{done=0}
              { if (!done && $0 ~ /^all:/) { printf "dir_$(%s)\t\t+= %s\n", sym, d ; done=1 } print }
            ' trunk/user/Makefile > /tmp/mk.new && mv /tmp/mk.new trunk/user/Makefile
            grep -q "$1" trunk/user/Makefile || { echo "::error::钩子没写进 trunk/user/Makefile：$1"; exit 1; }
          }

          for n in adbyby zerotier ; do
            if [ -f "trunk/user/$n/Makefile" ] ; then
              echo "$n 已解包"
            else
              t=$(pick "$n.tar.gz") || { echo "::error::找不到 $n.tar.gz（放仓库根或 trunk/user/ 都行）"; exit 1; }
              echo "解包 $t"
              tar -xzf "$t" -C .
              [ -f "trunk/user/$n/Makefile" ] || { echo "::error::$n 解包后没有 Makefile"; exit 1; }
            fi
            chmod +x trunk/user/$n/*.sh 2>/dev/null || true
          done

          [ -f trunk/user/ttyd/Makefile ] || { echo "::error::仓库里没有 trunk/user/ttyd，但 ttyd 必须集成"; exit 1; }
          echo "ttyd 就位：trunk/user/ttyd/Makefile"

          if [ -f trunk/user/pgyvpn/Makefile ] ; then
            echo "pgyvpn 已注入"
          else
            t=$(pick "pgyvpn-ci.tar.gz") || { echo "::error::找不到 pgyvpn-ci.tar.gz"; exit 1; }
            rm -rf /tmp/pgyvpn_ci
            tar -xzf "$t" -C /tmp
            if ! sh /tmp/pgyvpn_ci/apply.sh "$PWD" ; then
              echo "::warning::apply.sh 没跑完，改为直接铺目录（后台菜单入口可能缺，功能本身不受影响）"
              rm -rf trunk/user/pgyvpn
              cp -a /tmp/pgyvpn_ci/user_pgyvpn trunk/user/pgyvpn
            fi
          fi

          hook CONFIG_FIRMWARE_INCLUDE_ADBYBY adbyby
          hook CONFIG_FIRMWARE_INCLUDE_ZEROTIER zerotier
          hook CONFIG_FIRMWARE_INCLUDE_TTYD ttyd
          hook CONFIG_FIRMWARE_INCLUDE_PGYVPN pgyvpn

          echo "==== 插件目录 ===="
          ls -l trunk/user/adbyby trunk/user/ttyd trunk/user/zerotier 2>/dev/null | head -30
          du -sh trunk/user/pgyvpn 2>/dev/null || true
          echo "==== 编译钩子 ===="
          grep -nE 'INCLUDE_(ADBYBY|ALIDDNS|ZEROTIER|TTYD|PGYVPN)' trunk/user/Makefile

      - name: Fix mksquashfs_xz
        run: |
          XZD="$PWD/trunk/tools/mksquashfs_xz"
          if [ ! -f "$XZD/xz-5.2.4/configure" ] ; then
            echo "xz-5.2.4 缺 configure，从 padavan-4.4 同版本取整目录"
            rm -rf /tmp/p44xz
            git clone --depth 1 --filter=blob:none --sparse https://github.com/walter935581890/padavan-4.4.git /tmp/p44xz
            ( cd /tmp/p44xz && git sparse-checkout set trunk/tools/mksquashfs_xz/xz-5.2.4 )
            rm -rf "$XZD/xz-5.2.4"
            cp -a /tmp/p44xz/trunk/tools/mksquashfs_xz/xz-5.2.4 "$XZD/"
            rm -rf /tmp/p44xz
          fi
          [ -f "$XZD/xz-5.2.4/configure" ] || (echo "::error::xz configure 仍缺失"; exit 1)
          MK="$XZD/Makefile"
          sed -i 's|\./autogen\.sh ;|: ;|' "$MK"
          sed -i 's|\./configure \\|/bin/sh ./configure \\|' "$MK"
          grep -q -- '--disable-nls' "$MK" || sed -i 's|--disable-lzmainfo|--disable-lzmainfo --disable-nls|' "$MK"
          rm -f "$XZD/config_xz_done"
          grep -n -E 'autogen|bin/sh ./configure|disable-nls' "$MK"

      - name: Prepare toolchain
        run: |
          cd toolchain-mipsel
          sh dl_toolchain.sh

      - name: Run shellcheck
        run: sh ./trunk/tools/shellcheck.sh || true

      - name: Setup tmate session
        uses: mxschmitt/action-tmate@v3
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.debug_enabled == 'yes' }}
        with:
          limit-access-to-actor: true

      - name: Start build
        run: |
          cd trunk
          TB=configs/templates/$TNAME.config
          if [ ! -f "$TB" ] ; then echo "::error::型号模板不存在：$TB"; exit 1 ; fi
          mkdir -p ${images_dir}

          AVAIL="adbyby pgyvpn zerotier"

          # ttyd 固定集成：不管选什么都在
          sed -i "/^CONFIG_FIRMWARE_INCLUDE_TTYD=/d" "$TB"
          echo "CONFIG_FIRMWARE_INCLUDE_TTYD=y" >> "$TB"
          echo "ttyd 固定开启（CONFIG_FIRMWARE_INCLUDE_TTYD=y，不受插件选择影响）"

          key() {
            case "$1" in
              pgyvpn) echo PGYVPN ;;
              *) echo "$1" | tr 'a-z' 'A-Z' ;;
            esac
          }

          if [ "$PLUGINS" = "all" ] ; then PLUGINS="$AVAIL" ; fi
          if [ "$PLUGINS" = "none" ] ; then PLUGINS="" ; fi

          echo "==== 1. 先把 3 个可选插件全关掉（ttyd 不动） ===="
          for p in $AVAIL ; do
            k=$(key $p)
            sed -i "/^CONFIG_FIRMWARE_INCLUDE_${k}=/d" "$TB"
            echo "CONFIG_FIRMWARE_INCLUDE_${k}=n" >> "$TB"
          done

          echo "==== 2. 打开本次勾选的 ===="
          for p in $(echo "$PLUGINS" | tr ',' ' ') ; do
            [ -z "$p" ] && continue
            if [ "$p" = "ttyd" ] ; then echo "  = ttyd 已固定开启，无需填写"; continue ; fi
            case " $AVAIL " in *" $p "*) ;; *) echo "::error::插件名不正确：$p（可选：$AVAIL，ttyd 固定集成）"; exit 1 ;; esac
            k=$(key $p)
            sed -i "/^CONFIG_FIRMWARE_INCLUDE_${k}=/d" "$TB"
            echo "CONFIG_FIRMWARE_INCLUDE_${k}=y" >> "$TB"
            echo "  + $p ($k)"
          done

          echo "==== 3. 最终打开的功能 ===="
          grep -E "^CONFIG_FIRMWARE_INCLUDE_[A-Za-z0-9_]+=y" "$TB" | sort

          fakeroot ./build_firmware_ci $TNAME || exit 1
          cp -f images/*.trx ${images_dir}/$TNAME.trx
          sz=$(stat -c %s ${images_dir}/$TNAME.trx)
          mb=$(awk -v s="$sz" 'BEGIN{printf "%.2f", s/1048576}')
          echo "::notice::$TNAME.trx = $sz 字节 ($mb MB)"
          if [ "$sz" -gt 15000000 ] ; then
            echo "::warning::$TNAME 的 trx 已超过 15MB，16MB flash 的机型可能刷不进去"
          fi

      - name: Create archive
        if: ${{ success() }}
        run: |
          ls -lh ${images_dir}
          GIT_VERSION=`git rev-parse --short=7 HEAD 2>/dev/null` && [ -n "$GIT_VERSION" ] && \
          image_name=images_${TNAME}_${GIT_VERSION} || image_name=images_${TNAME}
          cd ${images_dir}; md5sum *.trx | tee md5sum.txt; 7z a -mx=9 ${image_name}.7z ./*
          echo "image_name=${image_name}" >> $GITHUB_ENV

      - name: Upload images to Artifact
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.image_name }}
          path: ${{ env.images_dir }}/*.7z

      - name: Upload images to Releases
        if: ${{ github.event_name == 'release' && success() }}
        uses: svenstaro/upload-release-action@2.2.0
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ${{ env.images_dir }}/*.trx
          tag: ${{ github.ref }}
          overwrite: true
          file_glob: true
